
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OFFROAD ADVENTURE LIVE MAP</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b1720;
    color: white;
}

.app {
    width: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
}

.header {
    background: #0c1821;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 1000;
    border-bottom: 1px solid #263b49;
}

.brand {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.brand-title {
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 1px;
}

.brand-subtitle {
    font-size: 10px;
    color: #9eabb5;
    letter-spacing: 2px;
}

.live {
    background: #143b2c;
    color: #3ee68b;
    border: 1px solid #2b8056;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: #101f2b;
    border-bottom: 1px solid #263b49;
    z-index: 1000;
}

.stat {
    padding: 10px 8px;
    text-align: center;
    border-right: 1px solid #263b49;
}

.stat-label {
    font-size: 9px;
    color: #9eabb5;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 5px;
}

.stat-value {
    font-size: 16px;
    font-weight: bold;
}

.stat-value.small {
    font-size: 12px;
}

#gpsStatus {
    color: #f5bd45;
}

#trackStatus {
    color: #aaa;
}

#distance {
    color: #54d8ff;
}

#speed {
    color: white;
}

.warning {
    display: none;
    padding: 10px;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    background: #b52c2c;
    color: white;
    z-index: 1000;
}

.warning.active {
    display: block;
}

#map {
    flex: 1;
    width: 100%;
    min-height: 0;
}

.controls {
    background: #0c1821;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
    z-index: 1000;
    border-top: 1px solid #263b49;
}

.btn {
    padding: 11px 5px;
    border: none;
    border-radius: 8px;
    background: #1c3445;
    color: white;
    font-weight: bold;
    font-size: 11px;
    cursor: pointer;
    transition: .2s;
}

.btn:hover {
    background: #31566c;
}

.btn.active {
    background: #117d4b;
}

.btn.sos {
    background: #c62828;
}

.btn.sos:hover {
    background: #e53935;
}

.footer {
    background: #0c1821;
    color: #81929f;
    text-align: center;
    font-size: 9px;
    padding: 5px;
}

.vehicle-marker {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #087cf0;
    border: 4px solid white;
    box-shadow: 0 0 0 5px rgba(8,124,240,.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}

.start-marker {
    background: #14a44d;
    color: white;
    border-radius: 8px;
    padding: 7px 10px;
    font-weight: bold;
    font-size: 12px;
    border: 2px solid white;
    white-space: nowrap;
}

.finish-marker {
    background: #d62828;
    color: white;
    border-radius: 8px;
    padding: 7px 10px;
    font-weight: bold;
    font-size: 12px;
    border: 2px solid white;
    white-space: nowrap;
}

.leaflet-control-attribution {
    font-size: 9px !important;
}

@media (max-width: 600px) {

    .header {
        padding: 10px 12px;
    }

    .brand-title {
        font-size: 14px;
    }

    .brand-subtitle {
        font-size: 8px;
    }

    .stat {
        padding: 8px 3px;
    }

    .stat-label {
        font-size: 8px;
    }

    .stat-value {
        font-size: 14px;
    }

    .controls {
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
        padding: 7px;
    }

    .btn {
        padding: 12px 2px;
        font-size: 9px;
        border-radius: 6px;
    }

    .footer {
        font-size: 8px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="brand">
            <div class="brand-title">🚙 OFFROAD ADVENTURE</div>
            <div class="brand-subtitle">LIVE GPS TRACKING SYSTEM</div>
        </div>

        <div class="live">● LIVE MAP</div>
    </header>

    <section class="dashboard">

        <div class="stat">
            <div class="stat-label">GPS</div>
            <div class="stat-value small" id="gpsStatus">WAITING</div>
        </div>

        <div class="stat">
            <div class="stat-label">TRACK STATUS</div>
            <div class="stat-value small" id="trackStatus">--</div>
        </div>

        <div class="stat">
            <div class="stat-label">DISTANCE TO TRACK</div>
            <div class="stat-value" id="distance">-- m</div>
        </div>

        <div class="stat">
            <div class="stat-label">SPEED</div>
            <div class="stat-value" id="speed">0 km/h</div>
        </div>

    </section>

    <div class="warning" id="offtrackWarning">
        ⚠️ PERHATIAN! ANDA KELUAR DARI JALUR OFFROAD
    </div>

    <div id="map"></div>

    <section class="controls">

        <button class="btn" onclick="locateMe()">
            📍 LOKASI
        </button>

        <button class="btn" id="followBtn" onclick="toggleFollow()">
            🧭 FOLLOW
        </button>

        <button class="btn" onclick="fitRoute()">
            🗺️ RUTE
        </button>

        <button class="btn" onclick="toggleFullscreen()">
            ⛶ FULL
        </button>

        <button class="btn sos" onclick="sendSOS()">
            🆘 SOS
        </button>

    </section>

    <footer class="footer">
        OFFROAD ADVENTURE LIVE MAP • OPENSTREETMAP
    </footer>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// =====================================================
// DATA JALUR OFFROAD
// =====================================================

// PENTING:
// GANTI BAGIAN INI DENGAN routeData DARI HTML V1 ANDA.
// Jangan mengubah koordinat jalur yang sudah ada.
//
// Contoh:
// const routeData = {...};

const routeData = {
    "type": "FeatureCollection",
    "features": []
};

// =====================================================
// KONFIGURASI
// =====================================================

const OFFTRACK_THRESHOLD = 50;

// Nomor WhatsApp panitia SOS.
// Format: 628xxxxxxxxxx
// Kosongkan jika belum tersedia.
const SOS_PHONE = "";

// =====================================================
// MAP
// =====================================================

const map = L.map('map', {
    zoomControl: true,
    preferCanvas: true
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

// =====================================================
// ROUTE
// =====================================================

let routeLayer = null;
let routeCoordinates = [];

if (routeData.features && routeData.features.length > 0) {

    routeLayer = L.geoJSON(routeData, {
        style: {
            color: '#00d4ff',
            weight: 6,
            opacity: 0.9
        }
    }).addTo(map);

    routeData.features.forEach(feature => {

        if (feature.geometry.type === "LineString") {

            routeCoordinates = feature.geometry.coordinates.map(
                coord => [coord[1], coord[0]]
            );

        }

        if (feature.geometry.type === "MultiLineString") {

            feature.geometry.coordinates.forEach(line => {

                line.forEach(coord => {
                    routeCoordinates.push([coord[1], coord[0]]);
                });

            });

        }

    });

    map.fitBounds(routeLayer.getBounds(), {
        padding: [40, 40]
    });

} else {

    map.setView([-8.024, 112.647], 15);

}

// =====================================================
// START & FINISH
// =====================================================

if (routeCoordinates.length > 0) {

    const start = routeCoordinates[0];
    const finish = routeCoordinates[routeCoordinates.length - 1];

    const startIcon = L.divIcon({
        className: '',
        html: '<div class="start-marker">🏁 START</div>',
        iconSize: [70, 30],
        iconAnchor: [35, 15]
    });

    const finishIcon = L.divIcon({
        className: '',
        html: '<div class="finish-marker">🏁 FINISH</div>',
        iconSize: [80, 30],
        iconAnchor: [40, 15]
    });

    L.marker(start, {
        icon: startIcon
    }).addTo(map);

    L.marker(finish, {
        icon: finishIcon
    }).addTo(map);

}

// =====================================================
// GPS MARKER
// =====================================================

const vehicleIcon = L.divIcon({
    className: '',
    html: '<div class="vehicle-marker">🚙</div>',
    iconSize: [42, 42],
    iconAnchor: [21, 21]
});

let vehicleMarker = null;
let accuracyCircle = null;
let currentPosition = null;
let followGPS = false;
let gpsWatch = null;

// =====================================================
// GPS
// =====================================================

function startGPS() {

    if (!navigator.geolocation) {

        document.getElementById('gpsStatus').innerText =
            "NOT SUPPORTED";

        return;

    }

    document.getElementById('gpsStatus').innerText =
        "SEARCHING";

    gpsWatch = navigator.geolocation.watchPosition(

        gpsSuccess,

        gpsError,

        {
            enableHighAccuracy: true,
            maximumAge: 1000,
            timeout: 15000
        }

    );

}

function gpsSuccess(position) {

    const lat = position.coords.latitude;
    const lng = position.coords.longitude;

    currentPosition = {
        lat: lat,
        lng: lng
    };

    const latlng = [lat, lng];

    document.getElementById('gpsStatus').innerText =
        "ACTIVE";

    document.getElementById('gpsStatus').style.color =
        "#3ee68b";

    // VEHICLE MARKER

    if (!vehicleMarker) {

        vehicleMarker = L.marker(latlng, {
            icon: vehicleIcon,
            zIndexOffset: 1000
        }).addTo(map);

    } else {

        vehicleMarker.setLatLng(latlng);

    }

    // ACCURACY CIRCLE

    const accuracy = position.coords.accuracy || 10;

    if (!accuracyCircle) {

        accuracyCircle = L.circle(latlng, {
            radius: accuracy,
            color: '#1685ff',
            fillColor: '#1685ff',
            fillOpacity: 0.12,
            weight: 1
        }).addTo(map);

    } else {

        accuracyCircle.setLatLng(latlng);
        accuracyCircle.setRadius(accuracy);

    }

    // SPEED

    let speed = position.coords.speed;

    if (speed === null || speed === undefined) {
        speed = 0;
    }

    speed = speed * 3.6;

    document.getElementById('speed').innerText =
        speed.toFixed(1) + " km/h";

    // DISTANCE TO ROUTE

    const distance = distanceToRoute(lat, lng);

    document.getElementById('distance').innerText =
        distance === null
            ? "-- m"
            : distance.toFixed(0) + " m";

    // TRACK STATUS

    if (distance === null) {

        document.getElementById('trackStatus').innerText =
            "NO ROUTE";

    } else if (distance <= OFFTRACK_THRESHOLD) {

        document.getElementById('trackStatus').innerText =
            "ON TRACK";

        document.getElementById('trackStatus').style.color =
            "#3ee68b";

        document.getElementById('offtrackWarning')
            .classList.remove('active');

    } else {

        document.getElementById('trackStatus').innerText =
            "OFF TRACK";

        document.getElementById('trackStatus').style.color =
            "#ff4444";

        document.getElementById('offtrackWarning')
            .classList.add('active');

    }

    // FOLLOW GPS

    if (followGPS) {

        map.setView(latlng, Math.max(map.getZoom(), 16), {
            animate: true
        });

    }

}

function gpsError(error) {

    document.getElementById('gpsStatus').innerText =
        "GPS ERROR";

    document.getElementById('gpsStatus').style.color =
        "#ff4444";

}

// =====================================================
// DISTANCE CALCULATION
// =====================================================

function distanceMeters(lat1, lon1, lat2, lon2) {

    const R = 6371000;

    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

    return R * c;

}

// =====================================================
// DISTANCE TO LINE SEGMENT
// =====================================================

function distanceToSegment(point, start, end) {

    const lat = point[0];
    const lng = point[1];

    const lat1 = start[0];
    const lng1 = start[1];

    const lat2 = end[0];
    const lng2 = end[1];

    const meanLat = lat * Math.PI / 180;

    const x = (lng - lng1) * 111320 * Math.cos(meanLat);
    const y = (lat - lat1) * 111320;

    const dx = (lng2 - lng1) * 111320 * Math.cos(meanLat);
    const dy = (lat2 - lat1) * 111320;

    const lengthSquared = dx * dx + dy * dy;

    if (lengthSquared === 0) {
        return Math.sqrt(x * x + y * y);
    }

    let t = (x * dx + y * dy) / lengthSquared;

    t = Math.max(0, Math.min(1, t));

    const closestX = t * dx;
    const closestY = t * dy;

    const distanceX = x - closestX;
    const distanceY = y - closestY;

    return Math.sqrt(distanceX * distanceX + distanceY * distanceY);

}

function distanceToRoute(lat, lng) {

    if (routeCoordinates.length < 2) {
        return null;
    }

    let minimumDistance = Infinity;

    const point = [lat, lng];

    for (let i = 0; i < routeCoordinates.length - 1; i++) {

        const distance = distanceToSegment(
            point,
            routeCoordinates[i],
            routeCoordinates[i + 1]
        );

        if (distance < minimumDistance) {
            minimumDistance = distance;
        }

    }

    return minimumDistance;

}

// =====================================================
// BUTTONS
// =====================================================

function locateMe() {

    if (!currentPosition) {

        alert("GPS belum mendapatkan lokasi. Pastikan GPS aktif.");

        return;

    }

    map.setView([
        currentPosition.lat,
        currentPosition.lng
    ], 17);

}

function toggleFollow() {

    followGPS = !followGPS;

    const button = document.getElementById('followBtn');

    if (followGPS) {

        button.classList.add('active');
        button.innerText = "🧭 FOLLOW ON";

        if (currentPosition) {

            map.setView([
                currentPosition.lat,
                currentPosition.lng
            ], 17);

        }

    } else {

        button.classList.remove('active');
        button.innerText = "🧭 FOLLOW";

    }

}

function fitRoute() {

    if (routeLayer) {

        map.fitBounds(routeLayer.getBounds(), {
            padding: [40, 40]
        });

    }

}

function toggleFullscreen() {

    const app = document.querySelector('.app');

    if (!document.fullscreenElement) {

        app.requestFullscreen().catch(() => {});

    } else {

        document.exitFullscreen();

    }

}

// =====================================================
// SOS
// =====================================================

function sendSOS() {

    if (!currentPosition) {

        alert("GPS belum aktif. Lokasi belum dapat dikirim.");

        return;

    }

    const lat = currentPosition.lat;
    const lng = currentPosition.lng;

    const mapsLink =
        "https://maps.google.com/?q=" + lat + "," + lng;

    const message =
        "🆘 SOS OFFROAD ADVENTURE\n\n" +
        "Saya membutuhkan bantuan.\n\n" +
        "📍 Lokasi:\n" +
        mapsLink + "\n\n" +
        "Koordinat:\n" +
        lat + ", " + lng;

    if (SOS_PHONE !== "") {

        const whatsappURL =
            "https://wa.me/" + SOS_PHONE +
            "?text=" + encodeURIComponent(message);

        window.open(whatsappURL, "_blank");

    } else {

        if (confirm(
            "Nomor panitia SOS belum diatur.\n\n" +
            "Bagikan lokasi melalui WhatsApp?"
        )) {

            window.open(
                "https://wa.me/?text=" +
                encodeURIComponent(message),
                "_blank"
            );

        }

    }

}

// =====================================================
// INITIALIZATION
// =====================================================

startGPS();

</script>

</body>
</html>
