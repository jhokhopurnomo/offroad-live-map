
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OFFROAD ADVENTURE LIVE MAP</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#081c2b;color:white;overflow:hidden}
#app{height:100dvh;width:100%;display:flex;flex-direction:column}
.top{padding:14px 16px;background:#0c1821;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #263b49}
.top h1{margin:0;font-size:19px;font-weight:900;letter-spacing:1px}
.top p{margin:4px 0 0;font-size:10px;color:#9eabb5;letter-spacing:2px}
.live{background:#143b2c;color:#3ee68b;border:1px solid #2b8056;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:bold}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:#101f2b;border-bottom:1px solid #263b49}
.stat{text-align:center;padding:10px 5px;border-right:1px solid #263b49}
.stat small{display:block;font-size:9px;color:#9eabb5;letter-spacing:1px;margin-bottom:5px}
.stat strong{font-size:15px}
#gpsStatus{color:#f5bd45}
#trackStatus{color:#aaa}
#distance{color:#54d8ff}
#speed{color:white}
.warning{display:none;padding:10px;background:#c62828;text-align:center;font-size:13px;font-weight:bold}
.warning.active{display:block}
#map{flex:1;min-height:0;width:100%}
.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:9px;background:#0c1821;border-top:1px solid #263b49}
.btn{padding:12px 3px;border:0;border-radius:8px;background:#1c3445;color:white;font-size:11px;font-weight:bold;cursor:pointer}
.btn.active{background:#117d4b}
.btn.sos{background:#c62828}
.footer{text-align:center;padding:5px;background:#0c1821;color:#81929f;font-size:9px}
.vehicle{width:42px;height:42px;border-radius:50%;background:#087cf0;border:4px solid white;box-shadow:0 0 0 5px rgba(8,124,240,.25);display:flex;align-items:center;justify-content:center;font-size:20px}
.start{background:#14a44d;color:white;padding:6px 10px;border-radius:8px;font-weight:bold;border:2px solid white;white-space:nowrap}
.finish{background:#d62828;color:white;padding:6px 10px;border-radius:8px;font-weight:bold;border:2px solid white;white-space:nowrap}
.leaflet-control-attribution{font-size:9px!important}

@media(max-width:600px){
.top{padding:10px 12px}
.top h1{font-size:14px}
.top p{font-size:8px}
.stat{padding:8px 2px}
.stat small{font-size:8px}
.stat strong{font-size:13px}
.controls{gap:4px;padding:7px}
.btn{padding:12px 2px;font-size:9px}
.footer{font-size:8px}
}
</style>
</head>

<body>

<div id="app">

<header class="top">
<div>
<h1>🚙 OFFROAD ADVENTURE</h1>
<p>LIVE GPS TRACKING SYSTEM</p>
</div>
<div class="live">● LIVE MAP</div>
</header>

<section class="stats">
<div class="stat">
<small>GPS</small>
<strong id="gpsStatus">WAITING</strong>
</div>

<div class="stat">
<small>TRACK STATUS</small>
<strong id="trackStatus">--</strong>
</div>

<div class="stat">
<small>DISTANCE TO TRACK</small>
<strong id="distance">-- m</strong>
</div>

<div class="stat">
<small>SPEED</small>
<strong id="speed">0 km/h</strong>
</div>
</section>

<div class="warning" id="warning">
⚠️ PERHATIAN! ANDA KELUAR DARI JALUR OFFROAD
</div>

<div id="map"></div>

<section class="controls">
<button class="btn" onclick="locateMe()">📍 LOKASI</button>
<button class="btn" id="followBtn" onclick="toggleFollow()">🧭 FOLLOW</button>
<button class="btn" onclick="fitRoute()">🗺️ RUTE</button>
<button class="btn" onclick="toggleFullscreen()">⛶ FULL</button>
<button class="btn sos" onclick="sendSOS()">🆘 SOS</button>
</section>

<footer class="footer">
OFFROAD ADVENTURE LIVE MAP • OPENSTREETMAP
</footer>

</div>

<script>

// ======================================================
// MAP
// ======================================================

const map=L.map('map',{zoomControl:true});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19,

}).addTo(map);

// ROUTE LAYER

const route=L.geoJSON(routeData,{

}
}).addTo(map);

const coords=routeData.features[0].geometry.coordinates;

setTimeout(()=>map.invalidateSize(),500);

const start=coords[0];

// GPS
// ======================================================

const vehicleIcon=L.divIcon({
className:'',
html:'<div class="vehicle">🚙</div>',
iconSize:[42,42],
iconAnchor:[21,21]
});

let vehicleMarker=null;
let accuracyCircle=null;
let currentPosition=null;
let followGPS=false;
let gpsWatch=null;

// ======================================================
// DISTANCE
// ======================================================

function distanceToSegment(point,start,end){

const lat=point[0];
const lng=point[1];

const lat1=start[0];
const lng1=start[1];

const lat2=end[0];
const lng2=end[1];

const meanLat=lat*Math.PI/180;

const x=(lng-lng1)*111320*Math.cos(meanLat);
const y=(lat-lat1)*111320;

const dx=(lng2-lng1)*111320*Math.cos(meanLat);
const dy=(lat2-lat1)*111320;

const lengthSquared=dx*dx+dy*dy;

if(lengthSquared===0)return Math.sqrt(x*x+y*y);

let t=(x*dx+y*dy)/lengthSquared;

t=Math.max(0,Math.min(1,t));

const closestX=t*dx;
const closestY=t*dy;

return Math.sqrt(
(x-closestX)**2+
(y-closestY)**2
);
}

function distanceToRoute(lat,lng){

let minimum=Infinity;

for(let i=0;i<coords.length-1;i++){

const start=[coords[i][1],coords[i][0]];
const end=[coords[i+1][1],coords[i+1][0]];

const distance=distanceToSegment(
[lat,lng],
start,
end
);

if(distance<minimum)minimum=distance;
}

return minimum;
}

// ======================================================
// GPS TRACKING
// ======================================================

function startGPS(){

if(!navigator.geolocation){

document.getElementById('gpsStatus').innerText='NOT SUPPORTED';
return;
}

if(gpsWatch!==null)return;

document.getElementById('gpsStatus').innerText='SEARCHING';

gpsWatch=navigator.geolocation.watchPosition(

function(position){

const lat=position.coords.latitude;
const lng=position.coords.longitude;
const latlng=[lat,lng];

currentPosition={lat,lng};

document.getElementById('gpsStatus').innerText='ACTIVE';
document.getElementById('gpsStatus').style.color='#3ee68b';

// VEHICLE MARKER

if(!vehicleMarker){

vehicleMarker=L.marker(latlng,{
icon:vehicleIcon,
zIndexOffset:1000
}).addTo(map);

vehicleMarker.bindPopup('🚙 Posisi Anda');

}else{

vehicleMarker.setLatLng(latlng);

}

// ACCURACY

const accuracy=position.coords.accuracy||10;

if(!accuracyCircle){

accuracyCircle=L.circle(latlng,{
radius:accuracy,
color:'#1685ff',
fillColor:'#1685ff',
fillOpacity:0.12,
weight:1
}).addTo(map);

}else{

accuracyCircle.setLatLng(latlng);
accuracyCircle.setRadius(accuracy);

}

// SPEED

let speed=position.coords.speed||0;

document.getElementById('speed').innerText=
(speed*3.6).toFixed(1)+' km/h';

// ROUTE DISTANCE

const distance=distanceToRoute(lat,lng);

document.getElementById('distance').innerText=
distance.toFixed(0)+' m';

// TRACK STATUS

const status=document.getElementById('trackStatus');
const warning=document.getElementById('warning');

if(distance<=50){

status.innerText='ON TRACK';
status.style.color='#3ee68b';
warning.classList.remove('active');

}else{

status.innerText='OFF TRACK';
status.style.color='#ff4444';
warning.classList.add('active');

}

// FOLLOW GPS

if(followGPS){

map.setView(latlng,Math.max(map.getZoom(),16));

}

},

function(error){

document.getElementById('gpsStatus').innerText='GPS ERROR';
document.getElementById('gpsStatus').style.color='#ff4444';

gpsWatch=null;

},

{
enableHighAccuracy:true,
maximumAge:1000,
timeout:15000
}

);
}

// ======================================================
// CONTROLS
// ======================================================

function locateMe(){

if(!currentPosition){

alert('GPS belum mendapatkan lokasi. Pastikan GPS aktif.');
startGPS();
return;

}

map.setView([
currentPosition.lat,
currentPosition.lng
],17);

}

function toggleFollow(){

followGPS=!followGPS;

const button=document.getElementById('followBtn');

if(followGPS){

button.classList.add('active');
button.innerText='🧭 FOLLOW ON';

if(currentPosition){

map.setView([
currentPosition.lat,
currentPosition.lng
],17);

}

}else{

button.classList.remove('active');
button.innerText='🧭 FOLLOW';

}

}

function fitRoute(){

map.fitBounds(route.getBounds(),{
padding:[40,40]
});

}

function toggleFullscreen(){

if(!document.fullscreenElement){

document.getElementById('app').requestFullscreen();

}else{

document.exitFullscreen();

}

}

// ======================================================
// SOS
// ======================================================

const SOS_PHONE="";

function sendSOS(){

if(!currentPosition){

alert('GPS belum aktif. Lokasi belum dapat dikirim.');
return;

}

const lat=currentPosition.lat;
const lng=currentPosition.lng;

const mapsLink=
'https://maps.google.com/?q='+lat+','+lng;

const message=
'🆘 SOS OFFROAD ADVENTURE\n\n'+
'Saya membutuhkan bantuan.\n\n'+
'📍 Lokasi:\n'+mapsLink+'\n\n'+
'Koordinat:\n'+lat+', '+lng;

if(SOS_PHONE){

window.open(
'https://wa.me/'+SOS_PHONE+
'?text='+encodeURIComponent(message),
'_blank'
);

}else{

if(confirm('Nomor panitia belum diatur. Bagikan lokasi melalui WhatsApp?')){

window.open(
'https://wa.me/?text='+encodeURIComponent(message),
'_blank'
);

}

}

}

// ======================================================
// START
// ======================================================

startGPS();

</script>
