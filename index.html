
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OFFROAD ADVENTURE LIVE MAP</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#0b1720;
    color:#fff
}

.app{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column
}

.header{
    background:#0c1821;
    padding:12px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:1000;
    border-bottom:1px solid #263b49
}

.brand{
    display:flex;
    flex-direction:column;
    gap:3px
}

.brand-title{
    font-size:17px;
    font-weight:900;
    letter-spacing:1px
}

.brand-subtitle{
    font-size:10px;
    color:#9eabb5;
    letter-spacing:2px
}

.live{
    background:#143b2c;
    color:#3ee68b;
    border:1px solid #2b8056;
    padding:6px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    background:#101f2b;
    border-bottom:1px solid #263b49;
    z-index:1000
}

.stat{
    padding:10px 8px;
    text-align:center;
    border-right:1px solid #263b49
}

.stat-label{
    font-size:9px;
    color:#9eabb5;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:5px
}

.stat-value{

.stat-value.small{

}

#gpsStatus{color:#f5bd45}
#trackStatus{color:#aaa}

.warning.active{display:block}

</section>

<footer class="footer">

</footer>

</div>

// =====================================================
// DISTANCE CALCULATION
// =====================================================

function distanceMeters(lat1,lon1,lat2,lon2){

    const R=6371000;

    const dLat=(lat2-lat1)*Math.PI/180;
    const dLon=(lon2-lon1)*Math.PI/180;

    const a=
        Math.sin(dLat/2)**2+
        Math.cos(lat1*Math.PI/180)*
        Math.cos(lat2*Math.PI/180)*
        Math.sin(dLon/2)**2;

    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// Distance point to line segment

function distanceToSegment(point,start,end){

    const lat=point[0];
    const lng=point[1];

    const lat1=start[0];
    const lng1=start[1];

    const lat2=end[0];
    const lng2=end[1];

    const meanLat=lat*Math.PI/180;

    const x=(lng-lng1)*111320*Math.cos(meanLat);
    const y=(lat-lat1)*111320;

    const dx=(lng2-lng1)*111320*Math.cos(meanLat);
    const dy=(lat2-lat1)*111320;

    const lengthSquared=dx*dx+dy*dy;

    if(lengthSquared===0){
        return Math.sqrt(x*x+y*y);
    }

    let t=(x*dx+y*dy)/lengthSquared;

    t=Math.max(0,Math.min(1,t));

    const closestX=t*dx;
    const closestY=t*dy;

    const distanceX=x-closestX;
    const distanceY=y-closestY;

    return Math.sqrt(
        distanceX*distanceX+
        distanceY*distanceY
    );
}

// Distance to route

function distanceToRoute(lat,lng){

    if(coords.length<2)return null;

    let minimumDistance=Infinity;

    const point=[lat,lng];

    for(let i=0;i<coords.length-1;i++){

        const start=[
            coords[i][1],
            coords[i][0]
        ];

        const end=[
            coords[i+1][1],
            coords[i+1][0]
        ];

        const distance=distanceToSegment(
            point,
            start,
            end
        );

        if(distance<minimumDistance){
            minimumDistance=distance;
        }
    }

    return minimumDistance;
}

// =====================================================
// GPS
// =====================================================

function startGPS(){

    if(!navigator.geolocation){

        document.getElementById('gpsStatus').innerText=
            'NOT SUPPORTED';

        return;
    }

    if(gpsWatch!==null)return;

    document.getElementById('gpsStatus').innerText=
        'SEARCHING';

    gpsWatch=navigator.geolocation.watchPosition(

        gpsSuccess,

        gpsError,

        {
            enableHighAccuracy:true,
            maximumAge:1000,
            timeout:15000
        }

    );
}

function gpsSuccess(position){

    const lat=position.coords.latitude;
    const lng=position.coords.longitude;

    currentPosition={
        lat:lat,
        lng:lng
    };

    const latlng=[lat,lng];

    // GPS STATUS

    const gpsStatus=document.getElementById('gpsStatus');

    gpsStatus.innerText='ACTIVE';
    gpsStatus.style.color='#3ee68b';

    // VEHICLE MARKER

    if(!vehicleMarker){

        vehicleMarker=L.marker(latlng,{
            icon:vehicleIcon,
            zIndexOffset:1000
        }).addTo(map);

        vehicleMarker.bindPopup('🚙 Posisi Anda');

    }else{

        vehicleMarker.setLatLng(latlng);

    }

    // GPS ACCURACY

    const accuracy=position.coords.accuracy||10;

    if(!accuracyCircle){

        accuracyCircle=L.circle(latlng,{
            radius:accuracy,
            color:'#1685ff',
            fillColor:'#1685ff',
            fillOpacity:0.12,
            weight:1
        }).addTo(map);

    }else{

        accuracyCircle.setLatLng(latlng);
        accuracyCircle.setRadius(accuracy);

    }

    // SPEED

    let speed=position.coords.speed;

    if(speed===null||speed===undefined){
        speed=0;
    }

    speed=speed*3.6;

    document.getElementById('speed').innerText=
        speed.toFixed(1)+' km/h';

    // DISTANCE TO TRACK

    const distance=distanceToRoute(lat,lng);

    document.getElementById('distance').innerText=
        distance===null
            ?'-- m'
            :distance.toFixed(0)+' m';

    // TRACK STATUS

    const trackStatus=
        document.getElementById('trackStatus');

    const warning=
        document.getElementById('offtrackWarning');

    if(distance===null){

        trackStatus.innerText='NO ROUTE';
        trackStatus.style.color='#aaa';

        warning.classList.remove('active');

    }else if(distance<=OFFTRACK_THRESHOLD){

        trackStatus.innerText='ON TRACK';
        trackStatus.style.color='#3ee68b';

        warning.classList.remove('active');

    }else{

        trackStatus.innerText='OFF TRACK';
        trackStatus.style.color='#ff4444';

        warning.classList.add('active');

    }

    // GPS FOLLOW

    if(followGPS){

        map.setView(
            latlng,
            Math.max(map.getZoom(),16),
            {animate:true}
        );
    }
}

// GPS ERROR

function gpsError(error){

    const gpsStatus=
        document.getElementById('gpsStatus');

    gpsStatus.innerText='GPS ERROR';
    gpsStatus.style.color='#ff4444';

    console.error(error);

}

// =====================================================

function locateMe(){

    if(!currentPosition){

        alert(
            'GPS belum mendapatkan lokasi.\n' +
            'Pastikan GPS HP aktif.'
        );

        startGPS();

        return;
    }

    map.setView([
        currentPosition.lat,
        currentPosition.lng
    ],17);
}

function toggleFollow(){

    followGPS=!followGPS;

    const button=
        document.getElementById('followBtn');

    if(followGPS){

        button.classList.add('active');
        button.innerText='🧭 FOLLOW ON';

        if(currentPosition){

            map.setView([
                currentPosition.lat,
                currentPosition.lng
            ],17);

        }

    }else{

        button.classList.remove('active');
        button.innerText='🧭 FOLLOW';

    }
}

function fitRoute(){

    map.fitBounds(route.getBounds(),{
        padding:[40,40]
    });
}

function toggleFullscreen(){

    const app=document.querySelector('.app');

    if(!document.fullscreenElement){

        app.requestFullscreen().catch(()=>{
            alert('Fullscreen tidak tersedia pada browser ini.');
        });

    }else{

        document.exitFullscreen();

    }
}

    const lat=currentPosition.lat;

    const mapsLink=

    const message=
        '🆘 SOS OFFROAD ADVENTURE\n\n'+
        'Saya membutuhkan bantuan.\n\n'+
        '📍 Lokasi:\n'+mapsLink+'\n\n'+
        'Koordinat:\n'+lat+', '+lng;

    if(SOS_PHONE!==""){

        const whatsappURL=
            'https://wa.me/'+SOS_PHONE+
            '?text='+encodeURIComponent(message);

        window.open(whatsappURL,'_blank');

    }else{

        if(confirm(
            'Nomor WhatsApp panitia belum diatur.\n\n'+
            'Bagikan lokasi melalui WhatsApp?'
        )){

            window.open(
                'https://wa.me/?text='+
                encodeURIComponent(message),
                '_blank'
            );
        }
    }
}

// =====================================================
// START GPS
// =====================================================

startGPS();

</script>
